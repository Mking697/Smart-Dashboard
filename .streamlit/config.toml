# Base theme. theme.py layers the full design system on top of this, but these
# values matter because Streamlit paints them before any CSS of ours loads -
# without them the page flashes default grey on every rerun.

[theme]
base = "light"
primaryColor = "#1E40AF"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#2C3E5D"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false
